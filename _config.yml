name: act65
description: More questions than answers
avatar: https://raw.githubusercontent.com/act65/act65.github.io/master/images/question-mark.png

# Where the source lives. Used to link notebooks straight to GitHub from a paper page.
repo: https://github.com/act65/doubt-journal
branch: master


# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics:

# Your website URL (e.g. http://barryclark.github.io or http://www.barryclark.co)
# Used for Sitemap.xml and your RSS feed
url: https://act65.github.io

# If you're hosting your site at a Project repository on GitHub pages
# (http://yourusername.github.io/repository-name)
# and NOT your User repository (http://yourusername.github.io)
# then add in the baseurl here, like this: "/repository-name"
baseurl:

#
# !! You don't need to change any of the configuration flags below !!
#

permalink: /:title/

# One folder per paper under _papers/<slug>/ — index.md is the review, and any marimo
# notebooks sit alongside it. Grouping is done with tags, not directories, so a paper can
# belong to several topics/archetypes at once. See _data/tags.yml.
collections:
  papers:
    output: true
    permalink: /papers/:path/

# The release of Jekyll Now that you're using
version: v1.2.0

markdown:
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Set the Sass partials directory, as we're using @imports
sass:
  style: :expanded # You might prefer to minify using :compressed

# Use the following plug-ins
plugins:
 - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
 - jekyll-feed # Create an Atom feed using the official Jekyll feed gem
 - jekyll-scholar
 # - jekyll-gist


# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - vendor/bundle
  - vendor/
  # - archive
  # - images
  # The notebook environment. Notebooks are linked to GitHub, not served.
  - "*.py"
  - pyproject.toml
  - uv.lock
  - .venv/
  - __marimo__/
  - scripts/
  - CLAUDE.md
  - TEMPLATE.md
  - TODO


defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      category: "main"
  -
    scope:
      path: ""
      type: papers
    values:
      layout: paper

# paginate: 5