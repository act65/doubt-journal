<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <title>{% if page.title %}{{ page.title }} · {% endif %}Doubt journal</title>
   <meta name="author" content="Editor" />

   <!-- syntax highlighting CSS -->
   <link rel="stylesheet" href="{{ '/css/syntax.css' | relative_url }}" type="text/css" />

   <!-- Homepage CSS -->
   <link rel="stylesheet" href="{{ '/css/screen.css' | relative_url }}" type="text/css" media="screen, projection" />
</head>
<body>

<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    extensions: ["tex2jax.js"],
    jax: ["input/TeX", "output/HTML-CSS"],
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      displayMath: [ ['$$','$$'], ["\[","\]"], ["\\[","\\]"] ],
      processEscapes: true
    },
    messageStyle: "none",
    "HTML-CSS": { availableFonts: ["TeX"] }
  });
</script>

<script type="text/javascript"
   src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js">
</script>

<div class="site">
  <div class="title">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a class="extra" href="{{ '/papers/' | relative_url }}">Papers</a>
    <a class="extra" href="{{ '/stats/' | relative_url }}">Scoreboard</a>
    <a class="extra" href="{{ '/backlog/' | relative_url }}">Backlog</a>
    <a class="extra" href="{{ '/accepted/' | relative_url }}">Accepted</a>
    <a class="extra" href="{{ '/rejected/' | relative_url }}">Rejected</a>
  </div>

  {{ content }}

</div>

</body>
</html>
