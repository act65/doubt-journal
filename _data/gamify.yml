# Scoring rules. Everything on /stats/ is derived from this file plus the papers themselves —
# nothing is hand-maintained, so the only way to move a number is to actually read something.

# How much a paper is worth, by how hard you actually looked at it. One read is the unit: the
# gap between `read` and `rebuilt` is the whole point, since reading twenty papers should not
# outscore rebuilding two. There is no credit for skimming — if you only read the abstract and
# the figures, it doesn't go in the journal.
depth:
  read:
    xp: 1
    label: Read
    blurb: Read it properly, start to finish. Could summarise the argument.
  rebuilt:
    xp: 3
    label: Rebuilt
    blurb: Reimplemented the core idea from scratch. There is a notebook.
  extended:
    xp: 5
    label: Extended
    blurb: Went past the paper — a new experiment, a case it gets wrong, a generalisation.

# Reviewer ranks, in ascending order of unearned authority. Denominated in XP, so with read = 1
# these read as "papers-equivalent": Reviewer 2 is ten decent reads, or three rebuilds.
ranks:
  - { at: 0,   name: Desk Clerk }
  - { at: 10,  name: Reviewer 2 }
  - { at: 25,  name: Reviewer }
  - { at: 50,  name: Area Chair }
  - { at: 100, name: Senior Area Chair }
  - { at: 200, name: Program Chair }
  - { at: 350, name: Editor-in-Chief }

# Papers per calendar year. The burn-down on /stats/ measures against this.
annual_target: 52

# Use it or lose it. Every finished ISO week (Monday to Sunday) from `since` onwards with no
# paper read costs `xp`. The current week is never charged — you have until Sunday — so the
# first week that can cost anything is the one containing `since`. Losses come off the total
# and so can cost a rank; XP never goes below zero.
idle_penalty:
  since: 2026-10-14
  xp: 1

# A paper counts as accepted at or above this rating; below it, rejected. No rating at all
# means the review is still under review.
accept_threshold: 5
