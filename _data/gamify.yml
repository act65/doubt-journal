# Scoring rules. Everything on /stats/ is derived from this file plus the papers themselves —
# nothing is hand-maintained, so the only way to move a number is to actually read something.

# How much a paper is worth, by how hard you actually looked at it. One review is the unit: the
# gap between `reviewed` and `rebuilt` is the whole point, since reviewing twenty papers should
# not outscore rebuilding two. There is no credit for skimming — if you only read the abstract and
# the figures, it doesn't go in the journal.
depth:
  reviewed:
    xp: 1
    label: Reviewed
    blurb: Read it properly, start to finish. Could summarise the argument.
  rebuilt:
    xp: 3
    label: Rebuilt
    blurb: Reimplemented the core idea from scratch. There is a notebook.
  extended:
    xp: 5
    label: Extended
    blurb: Went past the paper — a new experiment, a case it gets wrong, a generalisation.

# Reviewer ranks, in ascending order of unearned authority. Denominated in XP, so with reviewed = 1
# these read as "papers-equivalent": Reviewer 2 is ten decent reads, or three rebuilds.
ranks:
  - { at: 0,   name: Desk Clerk }
  - { at: 10,  name: Reviewer 2 }
  - { at: 25,  name: Reviewer }
  - { at: 50,  name: Area Chair }
  - { at: 100, name: Senior Area Chair }
  - { at: 200, name: Program Chair }
  - { at: 350, name: Editor-in-Chief }

# Papers per calendar year. The burn-down on /stats/ measures against this.
annual_target: 52

# Use it or lose it. Every finished ISO week (Monday to Sunday) from `since` onwards with no
# paper read costs `xp`. The current week is never charged — you have until Sunday — so the
# first week that can cost anything is the one containing `since`. Losses come off the total
# and so can cost a rank; XP never goes below zero.
idle_penalty:
  since: 2026-10-14
  xp: 1

# There is no accepted/rejected — the rating is the verdict. A rating below this counts as low,
# for the Hidden Gem paper badge, and nothing else.
low_rating: 7.5

# Accepting a paper from the reading queue starts a clock. `scripts/next_paper.py` writes a
# due date `days` ahead into _data/queue.yml, and from then on the review owes you a verdict:
# published, with a rating. A blank rating still counts as unfinished — that is the whole
# point of leaving it blank.
#
# Every finished week past the due date costs `xp`, up to `max_xp` for any one paper, so a
# paper you have quietly given up on cannot drain the whole scoreboard. Nothing accepted
# before `since` is ever charged. CI rescores daily, so this moves without a push.
review_deadline:
  days: 14
  xp: 1
  max_xp: 4
  since: 2026-10-14
