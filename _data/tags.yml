# Tags are the only grouping mechanism — there are no folders to nest papers into, so a paper
# can carry as many of these as it earns. The browse page builds one filter row per `kind`.
#
#   topic     — what the paper is about
#   archetype — what kind of contribution it makes (the taxonomy from the backlog)
#   meta      — anything else worth filtering on
#
# A tag used in a paper but missing here still works; it just renders with a prettified slug and
# lands in the "other" row. Add it here when you want it labelled and grouped properly.

# ---------------------------------------------------------------- topics
