# ---------------------------------------------------------------- archetypes
# "Recommend by contribution archetype, not topic" — these are the four that actually
# predict whether a paper is worth the time.
hidden-equivalence:
  label: Hidden equivalence
  kind: archetype
  blurb: "X is secretly Y."
shouldnt-happen:
  label: Shouldn't happen
  kind: archetype
  blurb: A result that contradicts what the field assumed.
clarity-essay:
  label: Clarity essay
  kind: archetype
  blurb: Foundational, re-readable, mostly prose.
reconception:
  label: Reconception
  kind: archetype
  blurb: Reframes a known object as something else entirely.

# ---------------------------------------------------------------- meta
classic:
  label: Classic
  kind: meta
  blurb: Published before 2000.
disputed:
  label: Disputed
  kind: meta
  blurb: I think the headline claim is wrong.
